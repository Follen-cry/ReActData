[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ssl-method"
version = "0.3.0"
description = "Agent-driven video SSL supervision construction with frozen downstream training and evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Anonymous"}]
keywords = ["video", "self-supervised-learning", "data-construction", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyYAML>=6.0.1",
  "uv>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "Pillow>=10.0.0"]
data = ["Pillow>=10.0.0", "opencv-python-headless>=4.8"]

[project.scripts]
video-ssl = "video_ssl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_ssl*"]

[tool.setuptools.package-data]
video_ssl = ["protocols/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
