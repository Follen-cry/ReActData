name: reactdata-v1
vars:
  setting: reactdata
  run: main
  bp_root: /scratch/network/ssd2/junlin/ssl_mllm/baseline_pipeline
  eval_dir: /scratch/network/ssd2/junlin/ssl_mllm/baseline_pipeline/data/v2/datasets/temporal_ssl/settings/main
  models_root: /scratch/network/ssd/junlin/models/internvlu-train
  v3_dir: /scratch/network/ssd2/junlin/ssl_mllm/internvlu-exp/data/v3/physictran38k/N0
model:
  snapshot: /scratch/network/ssd2/junlin/huggingface/hub/models--InternVL-U--InternVL-U/snapshots/f012d760e69712bb47f7d3d09a24280f346cee01
  conv_template: qwen2_5-chat-v3
  force_image_size: 448
  vision_select_layer: -1
  ps_version: v2
  drop_path_rate: 0.0
  grad_checkpoint: true
adapters:
  vit: frozen
  mlp: full
  llm: lora
  llm_lora_rank: 32
  llm_lora_alpha: null
  llm_lora_dropout: 0.05
  special_tokens: full
  gen_decoder: full
  vae: frozen
data:
  train_meta: /scratch/network/ssd2/junlin/ssl_mllm/internvlu-exp/data/v3/physictran38k/N0/meta/N0.json
  max_dynamic_patch: null
  min_dynamic_patch: 1
  dynamic_image_size: false
  use_thumbnail: false
  normalize_type: imagenet
  max_seq_length: 4096
  pad_to_max_length: false
  num_workers: 4
  system_prompt: auto
  on_bad_row: raise
gen_image:
  size: 512
  resize_mode: area
  cond_min_pixels: 262144
  cond_max_pixels: 1048576
  cond_max_length: 1024
  vae_cond: single
  cfg_dropout: 0.1
  cfg_dropout_all_frac: 0.5
  drop_vae_cond_on_all: true
  drop_response: strip
  allow_multi_vae_cond: false
loss:
  gen_weight: 0.5
  gen_warmup_steps: 0
  lm_weight: 0.0
  vae_latents: sample
  cond_vae_latents: mode
optim:
  lr: 2.0e-05
  gen_decoder_lr: 0.0001
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  max_grad_norm: 1.0
  scheduler: cosine
  warmup_ratio: 0.03
train:
  output_dir: /scratch/network/ssd/junlin/reactdata-v6/runs/r1/jobs/c003-s1000-g4
  epochs: 1
  max_steps: 8
  global_batch_size: 16
  per_device_batch_size: 1
  seed: 42
  log_every: 1
dist:
  backend: nccl
  find_unused_parameters: true
  static_graph: false
checkpoint:
  every_steps: 25
  keep_last: 1
  resume: auto
  export_at_end: false
  export_dir: null
eval:
  sets: []
  every_steps: null
  intervals: 5
  at_start: false
  diffusion_steps: 20
  seed: 0
  log_images: 6
  max_rows: null
  all_cfg_scale: 4.5
  part_cfg_scale: 2.0
  generation_mode: auto
tracking:
  backends:
  - jsonl
  project: reactdata-v1
  run_name: null
